{% extends 'base.html' %}
<!-- Укажите ваш базовый шаблон, если он называется иначе -->

{% block title %}Удалить товар{% endblock %}
{% block header %}Удаление товара{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3">
        <div class="alert alert-warning">
            Вы уверены, что хотите удалить товар
            <strong>«{{ object.name }}»</strong>?
            Действие нельзя отменить.
        </div>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Да, удалить</button>
            <a href="{% url 'catalog:product_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
