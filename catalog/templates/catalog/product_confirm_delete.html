{% extends 'catalog/base.html' %} 
<!-- Укажите ваш базовый шаблон, если он называется иначе -->

{% block content %}
  <h2>Удаление товара</h2>
  <p>Вы уверены, что хотите удалить товар <strong>«{{ object.name }}»</strong>?</p>
  
  <form method="post">
    {% csrf_token %}
    <!-- Кнопка подтверждения -->
    <button type="submit" style="color: red;">Да, удалить</button>
    <!-- Кнопка отмены (возвращает на страницу товара) -->
    <a href="{% url 'catalog:product_detail' object.pk %}">Отмена</a>
  </form>
{% endblock %}
